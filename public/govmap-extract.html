<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<title>אל המעיין — כלי פיתוח למפת מעיינות</title>
<script src="https://www.govmap.gov.il/govmap/api/govmap.api.js" defer onload="initGovMap()"></script>
<style>
  body { font-family: sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
  #map { width: 100%; height: 400px; border: 1px solid #ccc; margin-bottom: 20px; }
  button { padding: 10px 20px; font-size: 15px; cursor: pointer; margin-inline-end: 10px; }
  pre { background: #f5f5f5; padding: 15px; border-radius: 8px; max-height: 500px; overflow: auto; white-space: pre-wrap; }
  #status { margin: 10px 0; font-weight: bold; }
  .subtitle { color: #666; margin-top: -8px; }
</style>
</head>
<body>
  <h2>אל המעיין — כלי פיתוח פנימי</h2>
  <p class="subtitle">כלי עזר לשילוב נתוני שכבת המעיינות (416) של GovMap באפליקציית "אל המעיין" — אפליקציה למשפחות למציאת מעיינות בישראל.</p>
  <p>שלב 1: הכניסו את ה-Token. שלב 2: טענו את שכבת המעיינות. שלב 3: הורידו את הנתונים לשילוב במאגר האפליקציה.</p>

  <label>API Token: <input type="text" id="tokenInput" style="width:400px" placeholder="הדביקו כאן את ה-Token"></label>
  <br><br>
  <button onclick="startExtraction()">טעינת נתוני שכבת מעיינות</button>
  <button onclick="downloadResult()">הורדת נתונים לקובץ JSON</button>

  <div id="status"></div>
  <div id="map"></div>
  <pre id="output">התוצאה תופיע כאן...</pre>

  <script>
    let allResults = [];

    function initGovMap() {
      // Map created on button click, once token is entered, so we don't
      // need a valid token just to load the page.
    }

    function startExtraction() {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) {
        alert('יש להזין Token קודם');
        return;
      }
      document.getElementById('status').innerText = 'טוען מפה...';

      govmap.createMap('map', {
        token: token,
        layers: ["416"],
        showXY: true,
        identifyOnClick: false,
        isEmbeddedToggle: false,
        background: 3,
        layersMode: 1
      });

      setTimeout(() => {
        document.getElementById('status').innerText = 'טוען נתוני שכבת מעיינות...';
        govmap.getLayerEntities({ layerName: "416" }).then(function (response) {
          allResults = response;
          document.getElementById('output').innerText = JSON.stringify(response, null, 2);
          document.getElementById('status').innerText =
            'הושלם! נמצאו ' + (response.length || 0) + ' רשומות. אפשר להוריד כקובץ.';
        }).catch(function (err) {
          document.getElementById('status').innerText = 'שגיאה: ' + JSON.stringify(err);
          document.getElementById('output').innerText = JSON.stringify(err, null, 2);
        });
      }, 2000);
    }

    function downloadResult() {
      if (!allResults.length) {
        alert('אין עדיין תוצאה להורדה');
        return;
      }
      const blob = new Blob([JSON.stringify(allResults, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'springs_layer_data.json';
      a.click();
    }
  </script>
</body>
</html>
